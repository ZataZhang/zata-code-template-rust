[package]
name = "tpl-accounts"
description = "账号业务服务：普通用户认证、管理员认证与账号管理的独立进程入口和装配层。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "accounts-service"
path = "src/main.rs"

[[bin]]
name = "compose-config"
path = "src/bin/compose_config.rs"

[dependencies]
# composition root 是唯一允许依赖全部各层的地方。
tpl-api.workspace = true
tpl-core.workspace = true
tpl-engines.workspace = true
tpl-infrastructure.workspace = true

anyhow.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
redis.workspace = true
reqwest.workspace = true
serde_json.workspace = true
