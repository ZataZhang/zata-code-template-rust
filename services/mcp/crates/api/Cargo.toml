[package]
name = "tpl-mcp-api"
description = "MCP 服务 HTTP 接入层：REST 管理接口、调用方认证中间件与 Streamable HTTP MCP 网关。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
tpl-mcp-core.workspace = true

axum.workspace = true
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
serde.workspace = true
serde_json.workspace = true
time = { workspace = true, features = ["serde-well-known", "formatting", "parsing"] }
tokio.workspace = true
tokio-util = { workspace = true }
tower-http = { workspace = true, features = ["trace", "timeout"] }
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[lints]
workspace = true
