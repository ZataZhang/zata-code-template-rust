[workspace]
resolver = "3"
# services/accounts/crates/* 是账号服务私有层；services/* 是独立业务服务；tools/* 是开发期工具。
members = ["services/*", "services/accounts/crates/*", "services/agent-tracing/crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
publish = false

# 依赖版本统一在这里声明，各 crate 用 `xxx.workspace = true` 引用，避免版本漂移。
[workspace.dependencies]
# 账号服务内部 crate（依赖方向见 docs/architecture/system-design.md；声明的依赖由 services/accounts/tests/architecture.rs 检查）
tpl-api = { path = "services/accounts/crates/api" }
tpl-core = { path = "services/accounts/crates/core" }
tpl-engines = { path = "services/accounts/crates/engines" }
tpl-infrastructure = { path = "services/accounts/crates/infrastructure" }
tpl-agent-tracing-core = { path = "services/agent-tracing/crates/core" }
tpl-agent-tracing-api = { path = "services/agent-tracing/crates/api" }
tpl-agent-tracing-infrastructure = { path = "services/agent-tracing/crates/infrastructure" }

anyhow = "1"
clap = { version = "4", features = ["derive"] }
argon2 = "0.6"
async-trait = "0.1"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
pulldown-cmark = "0.13.5"
dotenvy = "0.15"
figment = { version = "0.10", features = ["toml", "env"] }
getrandom = "0.4"
gethostname = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
regex = "1"
redis = { version = "1", default-features = false, features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["cookies", "default-tls", "form", "json", "query"] }
serde_json = "1"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
sha2 = "0.11"
# 生产 SQL 用 query! / query_as! 编译期校验；CI 与 Docker 使用仓库里的 .sqlx 离线元数据。
# migrate! 宏也在编译期嵌入账号服务 services/accounts/migrations/ 目录里的 SQL 文件。
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "time", "json"] }
thiserror = "2"
tempfile = "3"
time = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "time", "sync"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"
# 公共 API 必须写 `///` 文档，对应 Python 版的 Ruff D100–D107。
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# argon2 在未优化的 dev 构建里慢几十倍，会拖慢登录相关的测试；只对它开优化。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
