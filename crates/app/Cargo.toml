[package]
name = "tpl-app"
description = "进程入口与 composition root：创建对象、读取配置、把各层实现接到一起。不承载业务规则。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# composition root 是唯一允许依赖全部各层的地方。
tpl-api.workspace = true
tpl-core.workspace = true
tpl-engines.workspace = true
tpl-infrastructure.workspace = true

anyhow.workspace = true
axum.workspace = true
sqlx.workspace = true
tokio = { workspace = true }
tracing.workspace = true

[dev-dependencies]
redis.workspace = true
reqwest.workspace = true
serde_json.workspace = true
