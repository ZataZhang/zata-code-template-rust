# 前台站点的入口代理（docker-compose.yml 里的 edge 服务）。
# 模板：启动时 ${变量} 会被环境变量替换，nginx 自己的 $变量 不受影响。
#
# 它存在的原因：Next.js 的 rewrite 代理**不会**追加 X-Forwarded-For，客户端发来的头原样透传到后端。
# 后端开了 trust_forwarded_for 时取该头最右的地址做限流，所以必须由一层我们自己的代理来写这个头，
# 否则攻击者每次换一个伪造的 IP 就能绕过按 IP 的限流。
#
# 前面还有 HTTPS 终止代理（Traefik / Caddy / 云负载均衡）时，把它的地址段填进 TRUSTED_PROXY_CIDR，
# nginx 才会从它传来的 X-Forwarded-For 里还原出真实客户端地址；不填则只认直接连进来的对端地址。
server {
    listen 80;
    server_name _;

    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 127.0.0.11 是 Docker 内置 DNS；用变量形式让 nginx 在上游容器重建后重新解析主机名。
    resolver 127.0.0.11 ipv6=off valid=5s;

    # /api/* 直接交给后端（去掉 /api 前缀），不经过 Next。
    location /api/ {
        set $backend_upstream ${BACKEND_UPSTREAM};
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖而不是追加：客户端自己写的值不会进入后端看到的头里。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $web_upstream ${WEB_UPSTREAM};
        proxy_pass http://$web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
    }
}
