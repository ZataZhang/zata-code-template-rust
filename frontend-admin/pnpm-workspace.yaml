# pnpm 配置（本目录是独立的 pnpm 项目，不是 workspace 成员）。
# 详见 https://pnpm.io/settings

# pnpm 11 要求用 allowBuilds 显式声明哪些依赖的 install/postinstall 脚本可以运行，
# 否则会打印 ERR_PNPM_IGNORED_BUILDS 并以退出码 1 失败。安装后按提示补全。
allowBuilds: {}

# 后台或自动化入口没有可供清理确认使用的 TTY；依赖预检可安全重建与当前 pnpm 配置不一致的 node_modules。
confirmModulesPurge: false
