# -----------------------------------------------------------------------------
# 整套服务：accounts、Agent、Agent tracing 三个后端、各自 PostgreSQL、Redis 和三个前端入口。
# MCP 服务是可选项：位于 mcp profile 内，由 just mcp-up 单独启动，不影响整套服务。
#
#   just stack-up      读取 Nacos 部署配置并构建、启动
#   just stack-down    停止（保留数据）
#   just stack-reset   停止并删除数据卷（会清空数据库与会话）
#   just mcp-up        单独启动 MCP 服务与其 PostgreSQL（同样从 Nacos 读取秘密）
#   just mcp-down      停止 MCP 服务（保留数据库）
#
# 与 docker-compose.testing.yml 的区别：那个只放本机开发用的中间件（明文密码、端口暴露）；
# 这个是完整部署，密码由 compose-config 从 Nacos 的独立 properties Data ID 注入。
#
# 流量走向：浏览器 → edge / admin / tracing-ui；三个 API 都不发布宿主机端口。
# 三个 nginx 入口都覆盖写 X-Forwarded-For；accounts 可据此执行来源 IP 限流。
# 浏览器永远不持有 Agent 服务 token：public 由 Next Route Handler、admin 由 nginx 在服务端注入。
#
# 注意：不要让浏览器直接访问 web（Next.js）——它的 rewrite 代理不会追加 X-Forwarded-For，客户端发来的
# 头会原样透传，开着 trust_forwarded_for 就能被伪造来绕过限流。所以 web 不发布端口，只能经 edge 访问。
# 前面再加一层 HTTPS 反向代理时见 docs/guides/deployment.md。
# -----------------------------------------------------------------------------

name: tpl

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 Nacos Compose 配置中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  tracing-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent_tracing
      POSTGRES_PASSWORD: ${AGENT_TRACING_DB_PASSWORD:?请在 Nacos Compose 配置中设置 AGENT_TRACING_DB_PASSWORD}
      POSTGRES_DB: agent_tracing
    volumes:
      - agent-tracing-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_tracing -d agent_tracing"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # 会话存在这里：开持久化，重启后用户不会被全部踢下线。
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?请在 Nacos Compose 配置中设置 REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  agent-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?请在 Nacos Compose 配置中设置 AGENT_DB_PASSWORD}
      POSTGRES_DB: agent
    volumes:
      - agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # MCP 服务是可选部署：只有启用 mcp profile（just mcp-up）时才会启动。
  # 相关秘密同样由 Nacos Compose 配置注入；缺失时该服务明确启动失败，不影响其他服务。
  mcp-postgres:
    image: postgres:17-alpine
    profiles: ["mcp"]
    environment:
      POSTGRES_USER: mcp
      POSTGRES_PASSWORD: ${MCP_DB_PASSWORD:-}
      POSTGRES_DB: mcp
    volumes:
      - mcp-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcp -d mcp"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  accounts:
    build:
      context: .
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # 浏览器经 HTTPS 访问时必须为 true（见 docs/guides/deployment.md）；本机 http://localhost 用 false。
      APP_AUTH__COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # 前面一定有我们自己的代理（前台 / 管理后台），accounts 不对外发布端口，所以可以信任。
      APP_AUTH__TRUST_FORWARDED_FOR: "true"
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      APP_LOGGING__FORMAT: ${LOG_FORMAT:-json}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # 镜像里没有 curl：用 bash 内置的 /dev/tcp 请求 /ready（同时检查 PostgreSQL 与 Redis）。
      # 必须显式调用 bash：CMD-SHELL 默认用 sh（dash），不支持 /dev/tcp。
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /ready HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      # 启动期的失败由 start_period 容忍；之后连续 6 次（约 30 秒）失败才判定为 unhealthy。
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  agent-service:
    build:
      context: .
      dockerfile: services/agent/Dockerfile
    environment:
      DATABASE_URL: postgres://agent:${AGENT_DB_PASSWORD}@agent-postgres:5432/agent
      # 用户/管理员身份只经 accounts 的公开 HTTP 边界校验。
      APP_AGENT__IDENTITY__USER_AUTH_URL: http://accounts:8080/auth/me
      APP_AGENT__IDENTITY__ADMIN_AUTH_URL: http://accounts:8080/admin/auth/me
      # 事件先进 Agent 本地 outbox，再由 worker 投递到 tracing；tracing 故障不影响 Run 完成。
      APP_AGENT__TRACING__INGEST_URL: http://agent-tracing:8090/api/v1/ingest
      AGENT_TRACING_PRODUCER_TOKEN: ${AGENT_TRACING_PRODUCER_TOKEN:?请在 Nacos Compose 配置中设置 AGENT_TRACING_PRODUCER_TOKEN}
      # 每个调用服务独立凭据；浏览器永远拿不到这些 token。
      AGENT_SERVICE_TOKENS_JSON: '[{"service_id":"web","token":"${AGENT_WEB_SERVICE_TOKEN:?请在 Nacos Compose 配置中设置 AGENT_WEB_SERVICE_TOKEN}"},{"service_id":"admin","token":"${AGENT_ADMIN_SERVICE_TOKEN:?请在 Nacos Compose 配置中设置 AGENT_ADMIN_SERVICE_TOKEN}"}]'
      APP_AGENT__PLATFORM_ADMIN_IDS: "${AGENT_PLATFORM_ADMIN_IDS:-[1]}"
      APP_AGENT__LOGGING__FORMAT: ${LOG_FORMAT:-json}
    volumes:
      - agent-blob-data:/app/data/blobs
    depends_on:
      agent-postgres:
        condition: service_healthy
      accounts:
        condition: service_healthy
      agent-tracing:
        condition: service_healthy
    healthcheck:
      # 镜像里没有 curl：用 bash 内置的 /dev/tcp 请求 /ready（同时检查 Agent 数据库）。
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8091 &&
          printf 'GET /ready HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  mcp-service:
    profiles: ["mcp"]
    build:
      context: .
      dockerfile: services/mcp/Dockerfile
    environment:
      MCP_DATABASE_URL: postgres://mcp:${MCP_DB_PASSWORD:-}@mcp-postgres:5432/mcp
      # 凭据加密主密钥与消费服务清单只由部署平台注入；浏览器永远拿不到这些值。
      MCP_CREDENTIAL_KEY_BASE64: ${MCP_CREDENTIAL_KEY_BASE64:-}
      MCP_CONSUMERS_JSON: ${MCP_CONSUMERS_JSON:-[]}
      # 容器内监听所有接口；宿主机只把端口映射到回环地址，供本机联调与 /ready 探测。
      APP_MCP__SERVER__HOST: 0.0.0.0
      APP_MCP__GATEWAY__ALLOWED_HOSTS: '["mcp-service","localhost","127.0.0.1","::1"]'
      APP_MCP__LOGGING__FORMAT: ${LOG_FORMAT:-json}
    ports:
      - "127.0.0.1:${MCP_PORT:-8092}:8092"
    depends_on:
      mcp-postgres:
        condition: service_healthy
    healthcheck:
      # 镜像里没有 curl：用 bash 内置的 /dev/tcp 请求 /ready（同时检查 MCP 数据库）。
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8092 &&
          printf 'GET /ready HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontends/public/Dockerfile
      args:
        # Next 的 rewrites 在构建时固化：改这个值要重新构建镜像。
        BACKEND_URL: http://accounts:8080
    environment:
      # 浏览器只访问同源 /api/agent/*；Next Route Handler 在服务端注入服务 token。
      AGENT_SERVICE_URL: http://agent-service:8091
      AGENT_SERVICE_TOKEN: ${AGENT_WEB_SERVICE_TOKEN}
    expose:
      - "3000"
    healthcheck:
      # stack-up --wait 必须等 Next.js 页面可用，避免 edge 在启动期间返回 502。
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/login')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 15s
    depends_on:
      accounts:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    restart: unless-stopped

  edge:
    image: nginx:1.27-alpine
    environment:
      BACKEND_UPSTREAM: accounts:8080
      WEB_UPSTREAM: web:3000
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    volumes:
      - ./deploy/edge.nginx.conf:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  admin:
    build:
      context: frontends/admin
    environment:
      BACKEND_UPSTREAM: accounts:8080
      # /agent-api/* 由 nginx 在服务端注入 admin 专属 token，浏览器不可见。
      AGENT_UPSTREAM: agent-service:8091
      AGENT_SERVICE_TOKEN: ${AGENT_ADMIN_SERVICE_TOKEN}
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    ports:
      - "${ADMIN_PORT:-8081}:80"
    depends_on:
      accounts:
        condition: service_healthy
      agent-service:
        condition: service_healthy
    restart: unless-stopped

  agent-tracing:
    build:
      context: .
      dockerfile: services/agent-tracing/Dockerfile
    environment:
      APP_DATABASE__URL: postgres://agent_tracing:${AGENT_TRACING_DB_PASSWORD}@tracing-postgres:5432/agent_tracing
      APP_ACCOUNTS__ADMIN_AUTH_URL: http://accounts:8080/admin/auth/me
      APP_PRODUCER__CREDENTIALS_JSON: ${AGENT_TRACING_PRODUCERS_JSON:-[]}
      APP_LOGGING__JSON: "true"
    depends_on:
      tracing-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8090 &&
          printf 'GET /ready HTTP/1.0\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 4s
      retries: 6
      start_period: 15s
    restart: unless-stopped

  tracing-ui:
    build:
      context: frontends/tracing
    environment:
      ACCOUNTS_UPSTREAM: accounts:8080
      TRACING_UPSTREAM: agent-tracing:8090
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-127.0.0.1}
    ports:
      - "${TRACING_UI_PORT:-8082}:80"
    depends_on:
      accounts:
        condition: service_healthy
      agent-tracing:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  agent-tracing-postgres-data:
  agent-postgres-data:
  mcp-postgres-data:
  agent-blob-data:
  redis-data:
