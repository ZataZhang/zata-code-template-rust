# tracing UI、管理员认证与 producer 写入口使用同一源；两个后端路由保持各自 API 契约。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript;

    # producer 契约本身带 /api 前缀，保留原 URI 转到 tracing 服务。
    location ^~ /api/v1/ingest/ {
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $tracing_upstream ${TRACING_UPSTREAM};
        proxy_pass http://$tracing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    # 管理员会话仍由 accounts-service 验证；浏览器 Cookie 不离开同源代理。
    location ^~ /api/admin/auth/ {
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $accounts_upstream ${ACCOUNTS_UPSTREAM};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$accounts_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 管理员只读 tracing 查询与导出路径去掉前端 /api 前缀。
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $tracing_upstream ${TRACING_UPSTREAM};
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$tracing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
