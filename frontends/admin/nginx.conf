# 模板：启动时 ${BACKEND_UPSTREAM} 会被替换成环境变量的值，nginx 自己的 $变量 不受影响。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 前面还有 HTTPS 终止代理时，把它的地址段填进 TRUSTED_PROXY_CIDR，才能还原出真实客户端地址；
    # 默认 127.0.0.1 等于不信任任何上一层，只认直接连进来的对端地址。
    set_real_ip_from ${TRUSTED_PROXY_CIDR};
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # /api/* 代理到后端并去掉 /api 前缀。
    # 用变量形式让 nginx 在后端容器重建后重新解析主机名；127.0.0.11 是 Docker 内置 DNS。
    #
    # 注意：后端默认只信任 TCP 对端地址做限流，经过这个代理后它看到的是 nginx 的地址。
    # 部署在这个代理之后时，需要在后端设置 APP_AUTH__TRUST_FORWARDED_FOR=true（并确保后端不能被绕过直连）。
    # 下面的 X-Forwarded-For 由本代理覆盖写入，所以后端取最右一项就是客户端地址。
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=5s;
        set $backend_upstream ${BACKEND_UPSTREAM};
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 覆盖而不是追加：客户端自己写的值不会进入后端看到的头里。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端路由回退到 index.html。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的静态资源长缓存；index.html 不缓存。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
