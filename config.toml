# 非敏感默认值。优先级：代码默认值 < 本文件 < 可选 Nacos TOML < 环境变量。
#
# - 覆盖单个值：APP_<分区>__<字段>，双下划线表示层级，如 APP_SERVER__PORT=9000
# - 数据库/Redis 连接串与管理员密码由 Nacos 或进程环境提供；.env.local 只放 Nacos 地址和认证凭据
# - Nacos namespace/group/Data ID 等非敏感定位信息固定写在下方 [nacos]；.env.local 只提供 server 地址与认证凭据
# - 指定别的配置文件：APP_CONFIG_FILE=/path/to/config.toml

[nacos]
namespace_id = "rust-study-dev"
group = "ACCOUNTS"
app_data_id = "rust-study-local.toml"
compose_data_id = "rust-study-compose.properties"

[server]
host = "127.0.0.1" # 容器里要改成 "0.0.0.0"（Dockerfile 已通过环境变量处理）
port = 8080

[logging]
level = "info"   # 也可用 RUST_LOG 覆盖，如 RUST_LOG=tpl_api=debug,info
format = "text"  # "text"（本地阅读）或 "json"（日志采集）

[database]
# url 可来自 Nacos TOML 或环境变量 DATABASE_URL。配置后账号服务启动时会自动执行 services/accounts/migrations/ 下的迁移，所以启动时数据库必须可达。
max_connections = 10
acquire_timeout_secs = 3

[redis]
# url 可来自 Nacos TOML 或环境变量 REDIS_URL，用作会话存储。
timeout_secs = 3 # 单次操作（含首次建立连接）的超时

# 认证（注册/登录/会话）需要 DATABASE_URL 和 REDIS_URL 同时配置；缺任何一个，/auth/* 返回 503，其余功能不受影响。
[auth]
session_ttl_secs = 604800 # 会话有效期，7 天；同时是 Cookie 的 Max-Age
cookie_name = "session"
cookie_secure = false     # 本地 HTTP 开发用 false；生产（HTTPS）必须改成 true：APP_AUTH__COOKIE_SECURE=true

# 登录/注册限流（计数存 Redis，多实例共享；固定窗口）。被限流时返回 429 并带 Retry-After。
# 开发时在本机反复注册/试错可能触发限制，调大这些值或等窗口结束即可。
login_max_failures_per_ip = 20       # 同一 IP 在窗口内允许的登录失败次数（挡撞库）
login_max_failures_per_account = 10  # 同一账号（不论哪个 IP）在窗口内允许的失败次数（挡分布式猜密码）
login_window_secs = 900              # 15 分钟
register_max_per_ip = 10             # 同一 IP 在窗口内允许的注册请求次数（成败都算）
register_window_secs = 3600          # 1 小时

# 只有服务确实部署在会**覆盖写或追加** X-Forwarded-For 的反向代理之后、且外部无法绕过代理直连时，才能设为 true；
# 否则攻击者可以随便填这个头来绕过按 IP 的限流。开启后取该头最右边的地址（由你的代理写入）。
# 注意：Next.js 的 rewrite 代理只是原样透传该头，不满足条件，前面必须有 nginx / Traefik 等（见 docs/guides/deployment.md）。
trust_forwarded_for = false

# 管理后台。管理员与普通用户完全隔离：独立的账号表、会话 Cookie（名字必须不同）与限流计数。
# Cookie 的 Secure 属性、是否信任代理头沿用上面 [auth] 的设置。
# 管理员没有注册入口，只能靠引导账号创建：同时设置环境变量
#   ADMIN_BOOTSTRAP_USERNAME 与 ADMIN_BOOTSTRAP_PASSWORD（或 APP_ADMIN__BOOTSTRAP_*），
# 启动时创建；账号已存在则什么都不改（绝不覆盖密码）。密码是密钥，不要写进本文件。
# 没有配置过任何管理员时，/admin/* 的登录永远失败，其余功能不受影响。
[admin]
session_ttl_secs = 43200              # 12 小时；比普通用户短，管理权限泄露的代价更大
cookie_name = "admin_session"
login_max_failures_per_ip = 10        # 比普通登录更严
login_max_failures_per_account = 5
login_window_secs = 900

# -----------------------------------------------------------------------------
# Agent 服务（services/agent，独立进程 agent-service，默认端口 8091）
# -----------------------------------------------------------------------------
# 只有 Agent 服务读取 [agent] 子树；accounts 与 agent-tracing 不会读取它。
# 数据库连接串由 DATABASE_URL（或 Nacos 应用 TOML 的 agent.database.url）注入；
# 调用服务凭据与服务间 token 只从环境注入：
#   AGENT_SERVICE_TOKENS_JSON       调用服务清单 [{"service_id":"web","token":"…"}]
#   AGENT_TRACING_PRODUCER_TOKEN   向 agent-tracing 投递事件的 producer token
#   AGENT_CREDENTIAL_<ALIAS>       外部 A2A Runtime 的 credential_alias 对应密钥
# 未配置 producer token 时投递 worker 不启动，事件保留在 outbox 等待恢复。
[agent]
# 部署级平台管理员的 accounts ID；只允许创建组织与授权组织管理员，不自动获得组织 scope。
platform_admin_ids = []

[agent.server]
host = "127.0.0.1" # 容器里由 Dockerfile 改成 "0.0.0.0"
port = 8091

[agent.logging]
level = "info"   # 也可用 RUST_LOG 覆盖
format = "text"  # "text"（本地阅读）或 "json"（日志采集）

[agent.database]
# url 来自 DATABASE_URL 或 Nacos；Agent 使用独立数据库，不与 accounts/tracing 共享。
max_connections = 10
acquire_timeout_secs = 3

[agent.identity]
# 用户与管理员身份分别经 accounts 的公开 HTTP 边界校验，不读取账号私有库。
user_auth_url = "http://127.0.0.1:8080/auth/me"
admin_auth_url = "http://127.0.0.1:8080/admin/auth/me"
request_timeout_secs = 3

[agent.storage]
# 用户资源、Skill 资产与 Run 产物都落在这个目录；Compose 挂载独立数据卷。
root = "./data/blobs"
max_resource_bytes = 10485760 # 10 MiB
max_artifact_bytes = 10485760 # 10 MiB

[agent.execution]
# 单次 A2A 请求（Agent Card 探测与消息发送）的超时。
a2a_timeout_secs = 60

[agent.tracing]
# agent-tracing producer ingest 基础地址；投递路径固定为 /runs/{run_id}/events。
ingest_url = "http://127.0.0.1:8090/api/v1/ingest"
poll_interval_ms = 1000
batch_events = 100 # tracing 契约上限 100
# producer_token 只由 AGENT_TRACING_PRODUCER_TOKEN 注入，不写在这里。

# builtin Runtime 由部署声明，全局只读；组织管理员只能接入外部 A2A Runtime。
# 工具白名单是 Sandbox 的能力边界：只允许 text.summarize、artifact.write、delegate_task。
[[agent.builtin_runtimes]]
name = "platform-sandbox"
display_name = "Platform Sandbox"
adapter_kind = "sandbox"
enabled = true
allowed_tools = ["text.summarize", "artifact.write", "delegate_task"]
max_steps = 8
