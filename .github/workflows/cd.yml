name: Release

# 推送形如 v1.2.3 的 tag 时：构建三个镜像（后端、前台、管理后台）并推送到 GHCR，再创建 GitHub Release。
# 镜像地址：ghcr.io/<owner>/<repo>-{backend,web,admin}，带版本号与 latest 两种 tag。
#
# 这里**不重复跑测试**：发布用的 tag 应当打在已经通过 CI 的提交上（见下面的「CI 必须已通过」步骤，没通过会拒绝发布）。
# 前台镜像的后端地址是构建参数（Next.js 把 rewrites 固化进产物）；默认值适用于 Compose 网络里叫 backend 的服务，
# 别的部署方式请用 workflow_dispatch 手动指定 backend_url。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      backend_url:
        description: "前台镜像的后端地址（构建参数 BACKEND_URL）"
        default: "http://backend:8080"
        required: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # 拒绝给没有通过 CI 的提交发布。workflow_dispatch 手动触发时同样检查。
  ci-passed:
    name: CI 必须已通过
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check CI conclusion for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          conclusion="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq '[.workflow_runs[] | select(.event != "pull_request")] | sort_by(.created_at) | last | .conclusion // "none"')"
          echo "CI conclusion for $SHA: $conclusion"
          if [ "$conclusion" != "success" ]; then
            echo "该提交没有一次成功的 CI 运行，拒绝发布。先让 CI 通过（或在 Actions 里重跑）。" >&2
            exit 1
          fi

  images:
    name: Build and push ${{ matrix.image.name }}
    needs: ci-passed
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: backend, context: ".", build_args: "" }
          - { name: web, context: frontend-public, build_args: "BACKEND_URL" }
          - { name: admin, context: frontend-admin, build_args: "" }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.image.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha
      - name: Resolve build args
        id: args
        env:
          BACKEND_URL_INPUT: ${{ inputs.backend_url }}
        run: |
          if [ "${{ matrix.image.build_args }}" = "BACKEND_URL" ]; then
            echo "value=BACKEND_URL=${BACKEND_URL_INPUT:-http://backend:8080}" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ steps.args.outputs.value }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}

  release:
    name: GitHub Release
    needs: images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --generate-notes --verify-tag
